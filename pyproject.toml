[tool.poetry]
name = "shifts-processor"
version = "0.2.0"
description = "מחשבון שכר לבקרי מקורות — Salary calculator for resources controllers."
authors = ["Tzvi Levitsky"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
ortools = "*"
flask = "^3.1.0"
gunicorn = "^23.0.0"
flask-swagger-ui = "*"
anthropic = "*"
python-docx = "*"
pillow = "*"

[tool.poetry.scripts]
run-service = "app:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"